services:
  - type: web
    name: slidesapp
    env: python
    rootDir: slides-app
    buildCommand: pip install -r requirements.txt && pybabel compile -d app/translations && python seed_demo.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

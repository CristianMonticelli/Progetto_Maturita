{% extends 'base.html' %}

{% block title %}Registrazione - SlidesApp{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
    <div class="form-edit">
        <h2 style="text-align: center; color: #ff6600; margin-top: 0;">📝 {{ _('Registrazione') }}</h2>
        <p style="text-align: center; color: #d9d9d9;">{{ _('Crea un nuovo account') }}</p>
        
        <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-group">
                <label for="username">👤 {{ _('Username') }}</label>
                <input 
                    type="text"
                    name="username" 
                    id="username" 
                    required
                    placeholder="{{ _('Scegli un username') }}"
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="email">📧 {{ _('Email') }} <span style="color:#aaa;font-size:0.85rem;">({{ _('opzionale, per recupero password') }})</span></label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="{{ _('tua@email.com') }}"
                    autocomplete="email"
                >
            </div>
            
            <div class="form-group">
                <label for="password">🔐 {{ _('Password') }}</label>
                <input 
                    type="password"
                    name="password" 
                    id="password" 
                    required
                    placeholder="{{ _('Scegli una password') }}"
                    autocomplete="new-password"
                >
            </div>
            
            <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 15px;">
                {{ _('Registrati') }}
            </button>
        </form>
        
        <hr style="margin: 20px 0; opacity: 0.3;">
        
        <p style="text-align: center; color: #d9d9d9;">
            {{ _('Hai già un account?') }} 
            <a href="{{ url_for('auth.login') }}" style="color: #ff6600; text-decoration: none; font-weight: 600;">
                {{ _('Fai login qui') }}
            </a>
        </p>
    </div>
</div>
{% endblock %}

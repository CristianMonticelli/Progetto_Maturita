{% extends 'base.html' %}

{% block title %}Recupero password - SlidesApp{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
    <div class="form-edit">
        <h2 style="text-align: center; color: #ff6600; margin-top: 0;">🔑 {{ _('Recupero password') }}</h2>
        <p style="text-align: center; color: #d9d9d9;">{{ _('Inserisci la tua email per ricevere il link di reset.') }}</p>
        
        <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-group">
                <label for="email">📧 {{ _('Email') }}</label>
                <input 
                    type="email"
                    name="email" 
                    id="email" 
                    required
                    placeholder="{{ _('La tua email') }}"
                    autocomplete="email"
                >
            </div>
            
            <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 15px;">
                {{ _('Invia link di reset') }}
            </button>
        </form>
        
        <hr style="margin: 20px 0; opacity: 0.3;">
        
        <p style="text-align: center; color: #d9d9d9;">
            <a href="{{ url_for('auth.login') }}" style="color: #ff6600; text-decoration: none; font-weight: 600;">
                ← {{ _('Torna al login') }}
            </a>
        </p>
    </div>
</div>
{% endblock %}

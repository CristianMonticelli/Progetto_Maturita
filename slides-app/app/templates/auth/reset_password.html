{% extends 'base.html' %}

{% block title %}Reimposta password - SlidesApp{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
    <div class="form-edit">
        <h2 style="text-align: center; color: #ff6600; margin-top: 0;">🔐 {{ _('Nuova password') }}</h2>
        <p style="text-align: center; color: #d9d9d9;">{{ _('Scegli una nuova password per il tuo account.') }}</p>
        
        <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-group">
                <label for="password">🔐 {{ _('Nuova password') }}</label>
                <input 
                    type="password"
                    name="password" 
                    id="password" 
                    required
                    placeholder="{{ _('Nuova password') }}"
                    autocomplete="new-password"
                >
            </div>
            
            <div class="form-group">
                <label for="confirm_password">🔐 {{ _('Conferma password') }}</label>
                <input 
                    type="password"
                    name="confirm_password" 
                    id="confirm_password" 
                    required
                    placeholder="{{ _('Ripeti la password') }}"
                    autocomplete="new-password"
                >
            </div>
            
            <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 15px;">
                {{ _('Reimposta password') }}
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Login - SlidesApp{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
    <div class="form-edit">
        <h2 style="text-align: center; color: #ff6600; margin-top: 0;">🔐 {{ _('Login') }}</h2>
        <p style="text-align: center; color: #d9d9d9;">{{ _('Accedi al tuo account') }}</p>
        
        <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-group">
                <label for="username">👤 {{ _('Username') }}</label>
                <input 
                    type="text"
                    name="username" 
                    id="username" 
                    required
                    placeholder="{{ _('Inserisci il tuo username') }}"
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="password">🔐 {{ _('Password') }}</label>
                <div style="position:relative;">
                    <input
                        type="password"
                        name="password"
                        id="password"
                        required
                        placeholder="{{ _('Inserisci la tua password') }}"
                        autocomplete="current-password"
                        style="padding-right:42px; width:100%; box-sizing:border-box;"
                    >
                    <button type="button" onclick="togglePwd('password',this)"
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:1.2rem;padding:0;">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 15px;">
                {{ _('Accedi') }}
            </button>
            
            <p style="text-align: center; margin-top: 10px;">
                <a href="{{ url_for('auth.forgot_password') }}" style="color: #ff6600; text-decoration: none; font-size: 0.9rem;">
                    {{ _('Password dimenticata?') }}
                </a>
            </p>
        </form>
        
        <hr style="margin: 20px 0; opacity: 0.3;">
        
        <p style="text-align: center; color: #d9d9d9;">
            {{ _('Non hai un account?') }} 
            <a href="{{ url_for('auth.register') }}" style="color: #ff6600; text-decoration: none; font-weight: 600;">
                {{ _('Registrati qui') }}
            </a>
        </p>
    </div>
</div>
<script>
function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.style.color = inp.type === 'text' ? '#ff6600' : '#aaa';
}
</script>
{% endblock %}

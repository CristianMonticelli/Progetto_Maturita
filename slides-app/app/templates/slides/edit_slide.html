{% extends 'base.html' %}

{% block content %}
  <h2>Modifica slide</h2>

  <form method="post" enctype="multipart/form-data" class="form-edit">
    <div class="form-group">
      <label for="title">Titolo slide</label>
      <input type="text" id="title" name="title" value="{{ slide['title'] }}" required>
    </div>
    <div class="form-group">
      <label for="content">Contenuto slide</label>
      <textarea id="content" name="content" style="height:120px;">{{ slide['content'] }}</textarea>
    </div>
    <div class="form-group">
      <label for="bg_color">Colore sfondo</label>
      <input type="color" id="bg_color" name="bg_color" value="{{ slide['bg_color'] or '#ffffff' }}" style="width:60px; height:60px; border-radius:8px; cursor:pointer; border:none; padding:0;">
      <div style="margin-top:10px; display:inline-block; padding:10px 14px; border-radius:8px; background: {{ slide['bg_color'] or '#ffffff' }}; color:#000; font-weight:600;">
        {{ slide['bg_color'] or '#ffffff' }}
      </div>
      <div style="margin-top:10px;">
        <span style="display:inline-block; background: rgba(255,0,0,0.18); border-radius:12px; padding:4px 10px; margin-right:5px;">R: {{ r }}</span>
        <span style="display:inline-block; background: rgba(0,255,0,0.18); border-radius:12px; padding:4px 10px; margin-right:5px;">G: {{ g }}</span>
        <span style="display:inline-block; background: rgba(0,0,255,0.18); border-radius:12px; padding:4px 10px;">B: {{ b }}</span>
      </div>
    </div>
    <div class="form-group">
      <label for="image">Immagine (opzionale)</label>
      <div class="file-input-wrapper">
        <span class="file-btn">Scegli foto</span>
        <input type="file" id="image" name="image" accept="image/*" class="file-input">
      </div>
      {% if slide['image'] %}
      <div class="current-image">
        <p>Immagine attuale:</p>
        <img src="{{ slide['image'] }}" alt="Current image" style="max-width: 200px; max-height: 150px; border-radius: 8px;">
        <button type="submit" name="remove_image" value="1" class="btn btn-danger" style="margin-top:10px;">Rimuovi immagine</button>
      </div>
      {% endif %}
    </div>
    <div class="action-row">
      <button type="submit" class="btn">Aggiorna</button>
      <a href="{{ url_for('presentations.presentazione', id=slide['presentation_id']) }}" class="btn btn-secondary">Annulla</a>
    </div>
  </form>
{% endblock %}
